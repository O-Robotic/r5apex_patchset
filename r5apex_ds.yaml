# Exploitable defects

# This fixes a stack smash in 'CNetChan::ProcessSubChannelData' caused by the last fragment
# of a split packet, which could exceed the stack allocated buffer size of 560 bytes.

    - type: code
      segment: .text
      mode: insert

      keep_stolen: true
      jump_back: true
      byte_restore_pos: trailing

      sig: 44 8D 04 ED ?? ?? ?? ?? 48 8B CB 48 8D 54 24

      # Check if fragment size of 'last' split packet doesn't exceed stack buffer size.
      # Jump to gadget (xor al, al; pop..; ret;).
      patch: |
        cmp rbp, 230h
        jg 140261CE6h

# This fixes a vulnerability in which the index field in the NET_SetConVar message
# could be used to read outside the static userinfo cvar string array.
# The oversize check was missing causing OOB reads! String array size is 0x27,
# so only index into it if its within bounds..

    - type: code
      segment: .text
      mode: insert

      keep_stolen: false
      jump_back: true
      byte_restore_pos: trailing

      sig: 75 ?? 41 B8 ?? ?? ?? ?? 48 89 7C 24 ?? 48 8B CB

      patch: |
        jz read_name
        cmp eax, 28h
        jb 14030E951h
        read_name:
        mov r8d, 104h

# This fixes a vulnerability in which the SQClass' '_members' buffer could overrun due to a missing check for current member count in the class.
# This has been patched on the Squirrel repo in commit: https://github.com/albertodemichelis/squirrel/commit/23a0620658714b996d20da3d4dd1a0dcf9b0bd98

    - type: code
      segment: .text
      mode: insert

      keep_stolen: true
      jump_back: false
      byte_restore_pos: trailing

      sig: 8B 0E 48 8B 7D

      patch: |
        mov rcx, qword ptr [rbx+40h]
        mov eax, dword ptr [rcx+54h]
        cmp eax, 0FFFFFFh
        jge exit
        mov ecx, [rsi]
        mov rdi, [rbp-38h]
        jmp 14106819Bh
        exit:
        xor bl, bl
        jmp 141068429h

