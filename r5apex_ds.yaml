# This fixes a bug where the control member 'CUtlBuffer::m_Get' is out of sync with the text buffer in 'CUtlBuffer::ParseToken'.
# When we iterate over each character in the token buffer, we perform an equality test between the read len and buf len to prevent
# a buffer overflow. Before this test happens, the read len always gets incremented by 1.
# When the test fails, the code continues to where it checks if the control character is a break character (delimiter), if so,
# the code breaks out of the loop, decrements the 'm_Get' member variable by 1, null-terminates the token buffer and returns the
# read len. The issue is that read len has been incremented by 1 during the equality test, but the m_Get member variable by -1,
# causing a desync. The next time 'ParseToken' is getting called, the control character will be off by one as 'm_Get' is off by one.
# The fix is to just nop the decrement operation in assembled code (see commit '4969a84' for the source code fix).

    - type: code
      segment: .text
      mode: replace

      sig: 48 89 43 ?? 48 3B 43 ?? 7E ?? 41 80 C8

      # Nop 'movaps  xmm6, xmm0' (extraneous move operation).
      patch: |
        nop

# ------------------------------------------------------------------------------------------------
# This fixes a regression that was caused after a refactor on HUD data structures; the base sizes
# are now written in a child structure, however, the function `Hud_SetScale` still accessed the old
# root structure members. This regression broke the HUD overlays for weapons such as the smart pistol,
# SRAM rocket launcher titan homing rockets, etc.. as well as the abstracted script function binding.
# The `Hud_SetScaleX()` and `Hud_SetScaleY()` methods actually do access the correct child data members
# confirming this function to be broken. The patch is simple; the child data structure is accessed
# below our incorrect instructions for obtaining the base size, we just move the instruction above the
# getters for the base size, and use that register instead with the updated offsets to obtain the right values.

# *** Hud_SetScale ***

    - type: code
      segment: .text
      mode: replace

      sig: 66 41 0F 6E 86 ?? ?? ?? ?? 66 41 0F 6E 8E

      patch: |
        mov rcx, qword ptr [r14+28h]
        movd xmm0, dword ptr [rcx+144h]
        movd xmm1, dword ptr [rcx+148h]

