# out of room in which the slot -1 is returned and the structure pointer is set to NULL. However,
# the structure pointer is still dereferenced leading to the crash. For the patch, the nulling of
# this register has been removed and the new space is used to transform the short jmp instruction
# to a long jmp to return gadget (which for all these functions either sets the slot result (-1)
# to the provided pointer, or into EAX).

