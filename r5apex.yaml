        add eax, 0FFFFFFD4h
        cmp eax, 3
        ja 140383335h
        cmp dword ptr [1666EC954h], 10h
        jle 140383335h
        movsxd rcx, dword ptr [1666EC950h]
        mov rdx, rcx
        nop
        nop

