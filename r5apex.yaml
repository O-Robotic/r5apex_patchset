      sig: 48 8B 94 C5 ?? ?? ?? ?? 69 C2 ?? ?? ?? ?? 48 C1 EA ?? C1 C0 ?? 69 C8 ?? ?? ?? ?? 69 C2 ?? ?? ?? ?? C1 C1 ?? C1 C0 ?? 81 C1 ?? ?? ?? ?? 69 C0 ?? ?? ?? ?? 44 8D 04 89 44 33 C0 41 C1 C0 ?? 41 81 C0 ?? ?? ?? ?? 43 8D 0C 80 83 F1 ?? 8B C1 C1 E8 ?? 33 C1 69 C8 ?? ?? ?? ?? 8B C1 C1 E8 ?? 33 C1 69 C8 ?? ?? ?? ?? 8B D1 C1 EA ?? 33 D1 45 33 C0 66 66 0F 1F 84 00

      patch: |
        mov r8, 167181688h
        mov rdx, qword ptr [r8]
        mov rdx, qword ptr [rdx+rax*8]

    - type: code
      segment: .text
      mode: insert

      keep_stolen: false
      jump_back: true

      sig: 48 8B 94 C5 70 40 00 00 69 C2 51 2D 9E CC 48 C1 EA 20 C1 C0 0F 69 C8 93 35 87 1B 69 C2 51 2D 9E CC C1 C1 0D C1 C0 0F 81 C1 14 AF DD FA 69 C0 93 35 87 1B 44 8D 04 89 44 33 C0 41 C1 C0 0D 41 81 C0 14 AF DD FA 43 8D 0C 80 83 F1 08 8B C1 C1 E8 10 33 C1 69 C8 6B CA EB 85 8B C1 C1 E8 0D 33 C1 69 C8 35 AE B2 C2 8B D1 C1 EA 10 33 D1 45 33 C0 23 15 42 1B DA 26

      patch: |
        mov r8, 167181688h
        mov rdx, qword ptr [r8]
        mov rdx, qword ptr [rdx+rax*8]

    - type: code
      segment: .text
      mode: replace

      sig: 4C 8D 1D ?? ?? ?? ?? 69 C6

      # The ones here are similar to the usages above, however we are lucky because the base is stored at
      # R11 and R11 was only used to access g_constBufferCollection.insertItems through immediate offset.
      # So we just change it to MOV ptr into R11 which allows us to index directly into our new array:
      patch: |
        mov r11, qword ptr [167181688h]

    - type: code
      segment: .text
      mode: replace

      sig: 49 39 84 CB

      # removed immediate '0x4070', because the new buffer is now in R11.
      patch: |
        cmp qword ptr [r11+rcx*8], rax


#   Code Defects

