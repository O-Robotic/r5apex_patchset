# This fixes a vulnerability in which the index field in the NET_SetConVar message
# could be used to read outside the static userinfo cvar string array.
# The oversize check was missing causing OOB reads! String array size is 0x27,
# so only index into it if its within bounds..

    - type: code
      segment: .text
      mode: insert

      keep_stolen: false
      jump_back: true
      byte_restore_pos: trailing

      sig: 75 ?? 41 B8 ?? ?? ?? ?? 48 89 7C 24 ?? 48 8B CB

      patch: |
        jz read_name
        cmp eax, 28h
        jb 14030E951h
        read_name:
        mov r8d, 104h

# This fixes a vulnerability in which the SQClass' '_members' buffer could overrun due to a missing check for current member count in the class.
# This has been patched on the Squirrel repo in commit: https://github.com/albertodemichelis/squirrel/commit/23a0620658714b996d20da3d4dd1a0dcf9b0bd98

    - type: code
      segment: .text
      mode: insert

      keep_stolen: true
      jump_back: false
      byte_restore_pos: trailing

      sig: 8B 0E 48 8B 7D

      patch: |
        mov rcx, qword ptr [rbx+40h]
        mov eax, dword ptr [rcx+54h]
        cmp eax, 0FFFFFFh
        jge exit
        mov ecx, [rsi]
        mov rdi, [rbp-38h]
        jmp 14106819Bh
        exit:
        xor bl, bl
        jmp 141068429h

#
# NET_ReceiveDatagram
# Fix incorrect return condition, oversized packets should not cause a return but should instead continue listening for more packets
#

    - type: code
      segment: .text
      mode: replace

      sig: 0F 8D ?? ?? ?? ?? 48 8B 47 ?? 83 38

      patch: |
        jge 140265650h

#
# NET_ReceiveDatagram
# Fix incorrect return condition, we should keep listening if we get malformed LZSS data
#

    - type: code
      segment: .text
      mode: replace

      sig: 0F 84 ?? ?? ?? ?? 81 3B

      patch: |
        jz 140265650h
        cmp dword ptr [rbx], 53535A4Ch
        jnz 140265650h
        movsxd rsi, dword ptr [rbx+4]
        lea eax, [rsi-1]
        cmp eax, 3FFFFh
        ja 140265650h

#
# MTX_ReadUserMsg_OpenedPack
# Clamp size to stack size
#

#Borked auto return, debug this

    - type: code
      segment: .text
      mode: insert

      keep_stolen: false
      jump_back: false
      byte_restore_pos: trailing

      sig: 45 84 F6 74 ?? 48 8D 5D

      patch: |
        cmp r14b, 10h
        jnb 1402A8338h
        test r14b, r14b
        jz 1402A7F33h
        jmp 1402A7F00h

#
# CClient::ProcessVoiceData
# This patch fixes a stack buffer overflow due to the net message length field being passed straight to bf_read::ReadBits
#

    - type: code
      segment: .text
      mode: insert

      keep_stolen: true
      jump_back: true
      byte_restore_pos: trailing

      sig: 44 8B 42 ?? 48 8B F9 48 8D 4A ?? 48 8B DA 48 8D 54 24

      patch: |
        mov r8d, [rdx+20h]
        cmp r8d, 1000h
        jg 1403069B1h
