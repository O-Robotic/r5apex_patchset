# ------------------------------------------------------------------------------------------------
# This fixes a regression that was caused after a refactor on HUD data structures; the base sizes
# are now written in a child structure, however, the function `Hud_SetScale` still accessed the old
# root structure members. This regression broke the HUD overlays for weapons such as the smart pistol,
# SRAM rocket launcher titan homing rockets, etc.. as well as the abstracted script function binding.
# The `Hud_SetScaleX()` and `Hud_SetScaleY()` methods actually do access the correct child data members
# confirming this function to be broken. The patch is simple; the child data structure is accessed
# below our incorrect instructions for obtaining the base size, we just move the instruction above the
# getters for the base size, and use that register instead with the updated offsets to obtain the right values.

# *** Hud_SetScale ***

    - type: code
      segment: .text
      mode: replace

