      sig: 49 8B 8C C7 ?? ?? ?? ?? 49 89 08 0F B6 41 ?? 2A 42 ?? 41 88 40

      # -- TextureStreamMgr_AddOrDrop
      # Remove immediate '0x235A7918'
      patch: |
