      # Dereference old array to get pointer to new array for the call to TextureStreamMgr_FillItems
      patch: |
        mov rcx, qword ptr [1635A7918h]

    - type: code
      segment: .text
      mode: insert

      keep_stolen: false
      jump_back: true

      sig: 42 8B 84 38 ?? ?? ?? ?? 89 44 24 ?? 48 89 74 24

      # r15 originally contained the module base, but this now contains the address of the new array,
      # the job_JT_RegisteredTypes array took advantage of the module base being in r15 and used that
      # to obtain JobType_s::field_2c at given array index. Since there wasn't enough space left inside
      # the current block, the code cave is used to recreate this logic. 
      # The module base is stored in r13 which will be clobbered directly after
      # the call to this function (TextureStreamMgr_AddOrDrop).
      patch: |
        lea r13, [140000000h]
        mov eax, dword ptr [rax+r13*1+0x27EE1E2C]


# The following patches are done to increase the buffer sizes of g_constBufferCollection in order
# to allow more const buffers to be loaded at runtime (the amount of assets we've ported so far
# made us reach the current limit of 3072).
# g_constBufferCollection.insertItems (inline array) was used directly at the following offsets,
# in the SDK we write the pointer to our new array directly at the address of the old array, and
# switch the LEA instruction out with MOV to make code dereference it and use our new array!

    - type: code
      segment: .text
      mode: replace

      sig: 4C 8D 25 ?? ?? ?? ?? 4C 89 70 ?? 4C 8D 35 ?? ?? ?? ?? 4C 89 78 ?? 4C 8D 3D ?? ?? ?? ?? 0F 1F 40

      patch: |
        mov r12, qword ptr [1671856B0h]

    - type: code
      segment: .text
      mode: replace

      sig: 48 8D 05 ?? ?? ?? ?? 49 C1 E2 ?? 4C 03 D0 41 83 42

      patch: |
        mov rax, qword ptr [1671856B0h]

# The access to the same array is slightly more obscure here, because g_constBufferCollection is
# used as base address, since the mutex lock is nearby (minor optimization) and the code uses the
# offset of the old static array (0x4070) as immediate to index right into it. In at the following
# patches, we jump to a code cave and instead use the pointer that is set at Gfx_InitShared() which
# allows for reassigning the buffer location directly from the SDK without patching anything again!

    - type: code
      segment: .text
      mode: insert

      keep_stolen: false
      jump_back: true

      sig: 48 39 B4 C5

      patch: |
        mov r10, 167181688h
        mov r11, qword ptr [r10]
        cmp qword ptr [r11+rax*8], rsi

# Same process is repeated here for the other use cases (note that register usage is different due to contextual reasons):

    - type: code
