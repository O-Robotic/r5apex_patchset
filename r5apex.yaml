    # Expand null check on the modelCache pointer to include checking for 0xDEADFEEDDEADFEED error value
    - type: code
      segment: .text
      mode: insert

      keep_stolen: true
      jump_back: true
      byte_restore_pos: trailing

      sig: 48 8B 40 ?? FF C3

      patch: |
        mov r10, 0DEADFEEDDEADFEEDh
        cmp rax, r10
        jz 1401E7B0Eh

    - type: code
      segment: .text
      mode: replace

      sig: 74 ?? 40 38 35 ?? ?? ?? ?? 75 ?? 83 FB

      # If we don't have an STBSP file, the field s_textureStreamMgr.hasResidentPages will be false. But if the texture
      # stream manager is initialized and the stream mode is set to default, the code will force the stream mode to disabled.
      # However, our engine has a working implementation of the GPU driven texture streaming system, and the correct thing
      # to do here is to not force anything, since our SDK will enable the GPU driven texture streaming system if an STBSP
      # file wasn't provided for the level. We turn the conditional jump to an unconditional jump here to skip this code.
      patch: |
        jmp 1403E0F74h

    - type: code
      segment: .text
      mode: replace

      sig: 48 8D 05 ?? ?? ?? ?? F3 0F 10 25

      # -- TextureStreamMgr_FillItems
      patch: |
        mov rax, [1635A7918h]
    
    - type: code
      segment: .text
      mode: replace

      sig: 4C 8D 35 ?? ?? ?? ?? 49 8B F8 48 8B DA 48 8B F1 BD

      # -- Pak_UpdateTextureAsset
      # Previously, this LEA'd the address of 's_textureStreamMgr', and used the instructions below to offset into the
      # 'streamingTextures' member. But now we dereference and load the address of our new array directly into r14.
      patch: |
        mov r14, [1635A7918h]

    - type: code
      segment: .text
      mode: replace

      sig: 49 8B 94 C6 ?? ?? ?? ?? 4D 89 94 C6

      # The following instruction patches remove the immediate '0x388' which is the actual offset to 'streamingTextures'
      # from the start of the struct 'TextureStreamMgr_s', since we store the address of our new array directly into r14
      # from the lea -> mov patch above, so we don't need to add that on top of the address.
      patch: |
        mov rdx, qword ptr [r14+rax*8]
        mov qword ptr [r14+rax*8], r10
        movzx eax, word ptr [r8]
        mov [rdx+38h], ax
        movzx eax, word ptr [r8]
        mov qword ptr [r14+rax*8], rdx
        jmp 1403ED181h
        nop
        nop
        nop
        nop
        nop
        nop
        nop
        nop
        nop
        nop
        nop
        nop
        dec eax
        mov [r14+rax*8], r10

    - type: code
      segment: .text
      mode: replace

      sig: 49 89 B4 C6

      patch: |
        mov [r14+rax*8], rsi


    - type: code
      segment: .text
      mode: replace

      sig: 4C 8D 25 ?? ?? ?? ?? 66 90 8B C5

      # -- TextureStreamMgr_GetStreamOverlay
      # Previously, this LEA'd the base address of our module, and used the instructions below to offset into the
      # 'streamingTextures' member using an immediate. But now we load the address of our new array directly into r12.
      
      #The patch (mov r9, qword ptr [r12+rax*8]) removes the immediate '0x235A7918' which is the actual offset to 'streamingTextures'
      # from the base address of our module. Since we store the address of our new array directly into r12 from
      #the lea -> mov patch above, so we don't need to add that on top of the address.
      
      patch: |
        mov r12, qword ptr [1635A7918h]
        xchg ax, ax
        mov eax, ebp
        mov r9, qword ptr [r12+rax*8]

    - type: code
      segment: .text
      mode: replace

      sig: 4C 8D 3D ?? ?? ?? ?? 49 3B C9

      # -- TextureStreamMgr_AddOrDrop
      # Swap LEA module base with MOV 's_textureStreamMgr.streamingTextures'.
      patch: |
        mov r15, qword ptr [1635A7918h]
    
    - type: code
