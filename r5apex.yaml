    #- type: code
    #  segment: .text
    #  mode: replace

    #  sig: F2 0F 10 0D ?? ?? ?? ?? F3 0F 10 15 ?? ?? ?? ?? 0F 5A C0 F2 0F 5D C8
    #  patch: |
    #    movss xmm2, dword ptr [1415BB7F4h]
    #    divss xmm2, xmm0
    #    jmp 14029729Ah


    # This patch adds support for loading the 'LUMP_PAKFILE' lump as a discrete file.
    # The function originally loaded the BSP, and stored the header in a local variable.
    # This means that we need to store the BSP header in the lump too, if we want to load
    # the packfile lump separately. To avoid this, we hook this function in SDK code,
    # and load the BSP header into the static 's_MapHeader' memory. The patch below makes
    # the function read the static fields instead, and uses the descritprs in the header to
    # read out the lump path passed in. A separate tool sets the 'fileofs' field to 0, so the
    # packfile lump can be loaded without any additional patching.

    #s_MapHeader.ident
    #original code
    #s_MapHeader.version
    #original code
    #original code
    #original code
    #s_MapHeader.lumps[LUMP_PAKFILE].filelen
    #original code
    #s_MapHeader.lumps[LUMP_PAKFILE].fileofs
    #Move the operation done at 0x382181 (stored into RCX) into RDX; no need to index into it again.
    #Due to the simplification of the operation above, 2 bytes had to be nopped.

    - type: code
      segment: .text
      mode: replace

      sig: 81 BD ?? ?? ?? ?? ?? ?? ?? ?? 0F 85 ?? ?? ?? ?? 8B 85 ?? ?? ?? ?? 83 C0 ?? 83 F8 ?? 0F 87 ?? ?? ?? ?? 83 BD ?? ?? ?? ?? ?? 0F 8E

      #s_MapHeader.ident
      patch: |
        cmp dword ptr [1666EC6C0h], 50534272h
        jnz 140383335h
        mov eax, dword ptr [rip+2636995Ch]
        add eax, 0FFFFFFD4h
        cmp eax, 3
        ja 140383335h
        cmp dword ptr [1666EC954h], 10h
        jle 140383335h
        movsxd rcx, dword ptr [1666EC950h]
        mov rdx, rcx
        nop
        nop

    - type: code
      segment: .text
      mode: replace

      sig: 4C 63 85 40 07 00 00

      #s_MapHeader.lumps[LUMP_PAKFILE].fileofs
      #s_MapHeader.lumps[LUMP_PAKFILE].filelen
      patch: |
        movsxd r8, dword ptr [1666EC950h]
        movsxd rdx, dword ptr [1666EC954h]


    - type: code
      segment: .text
      mode: replace

      sig: 81 BD ?? ?? ?? ?? ?? ?? ?? ?? 0F 85 ?? ?? ?? ?? 8B 85 ?? ?? ?? ?? 83 C0 ?? 83 F8 ?? 0F 87 ?? ?? ?? ?? 83 BD ?? ?? ?? ?? ?? 49 8B D6

      #s_MapHeader.ident
      #original code
      #s_MapHeader.version
      #original code
      #original code
      #original code
      #s_MapHeader.lumps[LUMP_PAKFILE].filelen
      #original code
      #original code
      #original code
      #original code
      #original code
      #s_MapHeader.lumps[LUMP_PAKFILE].fileofs
      patch: |
        cmp dword ptr [1666EC6C0h], 50534272h
        jnz 14038330Dh
        mov eax, dword ptr [rip+26369633h]
        add eax, 0FFFFFFD4h
        cmp eax, 3
        ja 14038330Dh
        cmp dword ptr [1666EC954h], 10h
        mov rdx, r14
        mov rcx, rsi
        jle 140383313h
        mov rax, qword ptr [rsi]
        xor r9d, r9d
        movsxd r8, dword ptr [1666EC950h]

    - type: code
      segment: .text
      mode: replace

      sig: 4C 63 85 50 0F 00 00 48 63 95 54 0F 00 00

      #s_MapHeader.lumps[LUMP_PAKFILE].fileofs
      #s_MapHeader.lumps[LUMP_PAKFILE].filelen
      patch: |
        movsxd r8, dword ptr [1666EC950h]
        movsxd rdx, dword ptr [1666EC954h]

    - type: code
      segment: .text
      mode: replace

      sig: 41 B8 ?? ?? ?? ?? C6 05 ?? ?? ?? ?? ?? 48 8D 15 ?? ?? ?? ?? 48 C7 44 24

      # This patch increases the 'CModelRenderSystem::m_BoneToWorldOriented' memory buffer size to 2MiB. Previously,
      # this was 1MiB, but would occasionally overflow when there are about 80 players rendering on the client's
      # screen. This satisfies the required memory size to render all 120 player models (active players on server).
      patch: |
        mov r8d, 200000h

    # This patch assigns the model and anim cache pointers to NULL instead of 0xDEADFEEDDEADFEED,
    # if the asset failed to load. The 0xDEADFEEDDEADFEED (DC_INVALID_HANDLE) assignment was most
    # likely done to catch errors in the asset loading system, since the pointer test won't fail
    # while the pointer is invalid, this cause a hard crash. We however don't want this as this
    # would cause issues loading BSP's with missing assets (the SDK handles the errors properly
    # and also logs what was failed to load).

    - type: code
      segment: .text
      mode: replace
    
      sig: 48 B8 ED FE AD DE ED FE AD DE 49 89 07
      
      # NULL RAX instead of mov'ing '0xDEADFEEDDEADFEED' to cache ptr in 'Pak_UpdateModelAsset()'
      patch: |
        xor rax, rax

    - type: code
      segment: .text
      mode: replace

      sig: 48 B8 ED FE AD DE ED FE AD DE 48 89 43 08

      # NULL RAX instead of mov'ing '0xDEADFEEDDEADFEED' to cache ptr in 'Pak_UpdateAnimRigAsset()'
      patch: |
        xor rax, rax

