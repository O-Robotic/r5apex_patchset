      mode: insert

      keep_stolen: false
      jump_back: true

      sig: 48 39 BC C5

      patch: |
        mov r10, 167181688h
        mov rcx, qword ptr [r10]
        cmp qword ptr [rcx+rax*8], rdi


    - type: code
