      sig: 81 BD ?? ?? ?? ?? ?? ?? ?? ?? 0F 85 ?? ?? ?? ?? 8B 85 ?? ?? ?? ?? 83 C0 ?? 83 F8 ?? 0F 87 ?? ?? ?? ?? 83 BD ?? ?? ?? ?? ?? 49 8B D6

